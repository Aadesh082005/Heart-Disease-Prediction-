
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f766e">
    <meta name="description" content="CardioSense AI educational heart health risk assessment.">
    <title>{% block title %}CardioSense AI{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{{ url_for('home') }}">
            <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="" class="brand-logo">
            <span>CardioSense<span class="brand-ai"> AI</span>
                <small>HEART HEALTH INTELLIGENCE</small>
            </span>
        </a>

        <button class="menu-toggle" type="button"
                aria-label="Toggle navigation" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>

        <nav class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('dashboard') }}">Overview</a>
            <a href="{{ url_for('predict') }}">Assessment</a>
            <a href="{{ url_for('about') }}">About</a>
        </nav>

        <a class="nav-cta" href="{{ url_for('predict') }}">Start assessment <span>↗</span></a>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <a class="footer-brand" href="{{ url_for('home') }}">CardioSense AI</a>
        <span>Educational machine-learning demonstration</span>
        <span>Not a medical diagnosis or substitute for professional care.</span>
    </footer>
</body>
</html>
